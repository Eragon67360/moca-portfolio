<!doctype html>
<!-- MOCA hover loop (8s, 1280x800). Real captures from moca-portfolio.vercel.app; see capture.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  /* MOCA palette: light_primary and light_secondary from tailwind.config.ts. */
  :root { --primary: #df482b; --secondary: #742119; --surface: #f2ebe3; }
  body { background: var(--surface); }
  .wipe { position: absolute; top: 0; bottom: 0; width: 1500px; left: -1500px; z-index: 30;
    background: var(--primary); box-shadow: 18px 0 0 var(--secondary); }
  /* The featured-projects carousel keeps rotating between captures; only the header corner with
     the real language menu is taken from the menu captures, so the carousel does not jump. */
  #menu, #menuHover { clip-path: inset(0 0 560px 1010px); }
</style>
</head>
<body>
<div class="stage">
  <div class="layer" id="landing"></div>
  <div class="layer" id="home">
    <img class="shot" id="homeEn" src="captures/home-en.png" />
    <img class="shot" id="menu" src="captures/menu.png" />
    <img class="shot" id="menuHover" src="captures/menu-hover.png" />
    <img class="shot" id="homeFr" src="captures/home-fr.png" />
  </div>
  <div class="layer" id="solutions"><img class="shot" id="solImg" src="captures/home-fr-full.png" /></div>
  <div class="layer" id="plans"><img class="shot" id="plansImg" src="captures/home-fr-full.png" /></div>
  <div class="wipe" id="wipe"></div>
  <div class="hv-cursor" id="cursor"></div>
</div>
<script src="engine.js"></script>
<script src="captures/layout.js"></script>
<script>
  const { tw, seg, keys, ease } = HV;
  const L = window.LAYOUT;
  const $ = (id) => document.getElementById(id);
  const center = (b) => [b.x + b.w / 2, b.y + b.h / 2];

  // Landing: the site's own typewriter, replayed at its captured cadence. The loop starts
  // on the first capture showing "Expert web des…", the state of the project card screenshot.
  const typing = L.typing.filter((s, k) => k > 0);
  const START = typing.findIndex((s) => s.text.length >= 14);
  const frames = typing.slice(START, START + 12);
  const landingImgs = frames.map((s) => {
    const img = document.createElement("img");
    img.className = "shot";
    img.src = `captures/landing-${s.i}.png`;
    $("landing").appendChild(img);
    return img;
  });
  const frameAt = (t) => {
    let k = 0;
    frames.forEach((s, j) => { if ((s.ms - frames[0].ms) / 1000 <= t) k = j; });
    return k;
  };

  const [gx, gy] = center(L.getStarted);
  const [lx, ly] = center(L.globe);
  const [fx, fy] = [L.french.x + 30, L.french.y + L.french.h / 2];
  const CLICK_START = 1.05, CLICK_GLOBE = 2.4, CLICK_FR = 3.15, FR_AT = 3.3;
  const moveCursor = HV.cursor($("cursor"), [
    [0.35, 820, 720], [CLICK_START - 0.05, gx + 20, gy + 4], [1.3, gx + 20, gy + 4],
    [1.75, 820, 560], [CLICK_GLOBE - 0.05, lx, ly], [2.6, lx, ly], [3.0, fx, fy], [3.6, fx + 6, fy + 30],
  ], [CLICK_START, CLICK_GLOBE, CLICK_FR]);

  /** A red panel with a dark red edge sweeping across the frame, fully covering it at `mid`. */
  const wipeX = (t, start, mid, end) =>
    t < start || t > end ? -1600 : t < mid ? tw(t, start, mid, -1600, -110, ease.in) : tw(t, mid, end, -110, 1300, ease.out);
  const WIPES = [[1.1, 1.4, 1.75], [3.85, 4.15, 4.5], [5.35, 5.65, 6.0], [6.85, 7.15, 7.5]];

  // Full-page scroll positions (CSS px) for the services and subscription plans.
  const PAGE_H = 5315;
  const solY = L.solutions.y - 70;
  const plansY = Math.min(L.plans.y - 90, PAGE_H - 800);

  window.DURATION = 8;
  window.renderAt = (t) => {
    const scene = t < 1.4 ? "landing" : t < 4.15 ? "home" : t < 5.65 ? "solutions" : t < 7.15 ? "plans" : "landing";
    for (const id of ["landing", "home", "solutions", "plans"]) $(id).style.opacity = id === scene ? 1 : 0;

    // Landing: typing plays at the start; after the last wipe it is the first frame again.
    const k = t < 4 ? frameAt(t) : 0;
    landingImgs.forEach((img, j) => (img.style.opacity = j === k ? 1 : 0));
    const ls = t < 4 ? tw(t, 0, 1.4, 1, 1.04) : tw(t, 7.15, 7.85, 1.04, 1, ease.out);
    $("landing").style.transformOrigin = `${gx}px ${gy}px`;
    $("landing").style.transform = `scale(${ls})`;

    // Home: the real language menu, its hover state, then the page in French.
    $("menu").style.opacity = t >= CLICK_GLOBE + 0.08 ? 1 : 0;
    $("menuHover").style.opacity = t >= 2.95 ? 1 : 0;
    // The locale switch is a client-side route change: the page swaps at once.
    $("homeFr").style.opacity = t >= FR_AT ? 1 : 0;

    // Services, then subscription plans, gently scrolled.
    $("solImg").style.transform = `translateY(${-tw(t, 4.15, 5.65, solY - 40, solY + 120, ease.linear)}px)`;
    $("plansImg").style.transform = `translateY(${-tw(t, 5.65, 7.15, plansY - 160, plansY, ease.out)}px)`;

    const w = WIPES.map(([a, m, b]) => wipeX(t, a, m, b)).find((x) => x > -1600) ?? -1600;
    $("wipe").style.transform = `translateX(${w + 1500}px)`;

    moveCursor(t);
    // The cursor belongs to the page, not the transition: hide it while a wipe crosses the frame.
    if (w > -1600) {
      $("cursor").style.opacity = 0;
      document.querySelector(".hv-click").style.opacity = 0;
    }
  };
</script>
</body>
</html>
